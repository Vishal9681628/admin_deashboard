<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="side-bar">
        <div class="logo">
          <img src="./assests/view-dashboard.png" alt="logo" height="50px" width="50px"/>
          <a class="dText" href="./index.html">Dashboard</a>
        </div>
        <div class="menu"></div>
        <div class="settings"></div>
      </div>
      <div class="main-box">
        <div class="header">
          <div class="search-bar" style="grid-area: box1;"></div>
          <div class="profile" style="grid-area: box2;"></div>
          <div class="user" style="grid-area: box3;"></div>
          <div class="fbutton" style="grid-area: box4;"></div>
        </div>
        <div class="main-content">
            <div class="project" style="grid-area: box1;">
                <p>Your Projects</p>
                <div class="projectBox">
                    <div class="pBox1"></div>
                    <div class="pBox2"></div>
                    <div class="pBox3"></div>
                    <div class="pBox4"></div>
                    <div class="pBox5"></div>
                    <div class="pBox6"></div>
                </div>
            </div>
            <div class="announcement" style="grid-area: box2;">
                <p>Announcements</p>
                <div class="aBox">
                    <div class="aBox1"></div>
                    <div class="aBox2"></div>
                    <div class="aBox3"></div>
                </div>
            </div>
            <div class="tranding" style="grid-area: box3;">
                <p>Trending</p>
                <div class="tBox">
                    div*4.tBox$
                </div>
            </div>
        </div>
      </div>
    </div>
  </body>
</html>
